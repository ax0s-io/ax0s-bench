[project]
name = "ax0s-bench"
version = "0.0.1"
description = "Reproducible local benchmarks for memory-system conditions"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastembed==0.8.0",
    "graphiti-core[falkordblite]",
    "json-repair==0.63.2",
    "mem0ai==2.0.18",
    "memmachine-common",
    "memmachine-server",
    "spacy==3.8.15",
]

[project.scripts]
ax0s-bench = "ax0s_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax0s_bench"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
graphiti-core = { git = "https://github.com/getzep/graphiti", rev = "10374d6044f91b9ecae3586828abb1ecbf022c4f" }
memmachine-common = { git = "https://github.com/MemMachine/MemMachine", subdirectory = "packages/common", rev = "2d28c1c1e57d1026335c4a829b1a9b0a918c114f" }
memmachine-server = { git = "https://github.com/MemMachine/MemMachine", subdirectory = "packages/server", rev = "2d28c1c1e57d1026335c4a829b1a9b0a918c114f" }

[tool.ruff]
target-version = "py312"
line-length = 120
