[condition]
name = "ax0s-memory-current-embedded-turn-records"
adapter = "ax0s_memory"
description = "ax0s-memory 0.5.0 at canonical hub revision bcd8710 stores every chronological LoCoMo turn as a scratch-only record, then weighted-hybrid recalls top-20 into the frozen answer/judge protocol."
source_revision = "bcd871066173ca10fcbc7d0a6f1091152e472b3b"
source_path = "vendor/ax0s-memory-bcd8710"
package = "ax0s-memory==0.5.0 (editable from exact source revision)"
package_version = "0.5.0"
embedding_model = "Qwen/Qwen3-Embedding-0.6B"
embedding_dims = 1024
embedding_max_seq_tokens = 2048
store_path = ".bench/ax0s-bcd8710-full-v1/data"
ingestion_log_path = "logs/locomo-ax0s-bcd8710-qwen38-full-v1-ingestion.jsonl"
reset_store = true
slug_prefix = "bench-locomo-ax0s-bcd8710-v1"
mode = "hybrid"
ranker = "weighted"
top_k = 20
category_scope = "all categories 1-5; categories 1-4 also reported as a secondary slice"
timestamp_transport = "LoCoMo naive minute timestamp interpreted as UTC; synthetic per-turn second offsets preserve within-session order; authoritative content prefix and GOV-07 envelope retain the original header"
write_boundary = "scratch AX0S_DATA_ROOT only; no production store or service writes"

# Production recall configuration mirrored from hub /etc/ax0s-memory/env on 2026-08-25.
# Unset knobs use package defaults and are recorded explicitly in versions.json.
recall_env_ax0s_reranker = "cross-encoder"
recall_env_ax0s_reranker_batch = "8"
recall_env_ax0s_rerank_fusion = "rrf"
recall_env_ax0s_rerank_rrf_weight = "2.0"
recall_env_ax0s_recall_narrow_filters = "on"

